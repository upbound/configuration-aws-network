apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.aws.platform.upbound.io
spec:
  scope: Namespaced
  group: aws.platform.upbound.io
  names:
    kind: Network
    plural: networks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  description: Network Parameters
                  type: object
                  properties:
                    id:
                      type: string
                      description: >-
                        Platform identifier for this network. Sibling composites
                        (Compute, DataStore, Ingress) reference the network by
                        this id — never by cloud resource ids.
                    region:
                      type: string
                      description: Cloud region, e.g. us-west-2.
                    availabilityZones:
                      type: integer
                      minimum: 1
                      maximum: 6
                      default: 3
                      description: >-
                        Number of AZs to span. The composition computes the
                        subnet plan; adding an AZ is a field change, not a
                        consumer-side CIDR exercise.
                    cidrBlock:
                      type: string
                      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
                      default: "10.0.0.0/16"
                      description: >-
                        Address space for the network. The composition subdivides
                        it: with public-private, the lower half hosts the public
                        tier and the upper half the private tier, each split
                        evenly across AZs.
                    subnetStrategy:
                      type: string
                      enum: [public-private, private-only, public-only]
                      default: public-private
                    natGateway:
                      type: string
                      enum: [per-az, single, none]
                      default: single
                      description: >-
                        Egress strategy for private subnets. per-az gives each
                        zone an independent egress path (losing one AZ does not
                        impair the others — static stability as a consumer
                        choice); single trades that for cost; none means no
                        internet egress (pair with VPC endpoints). Ignored for
                        public-only.
                    dnsSupport:
                      type: boolean
                      default: true
                    dnsHostnames:
                      type: boolean
                      default: true
                    defaultSecurityPolicy:
                      type: string
                      enum: [restrictive, permissive]
                      default: restrictive
                      description: >-
                        restrictive creates the network security group with no
                        ingress rules — workloads bring their own. permissive
                        allows all traffic originating within the network CIDR
                        (development convenience). The network layer defines NO
                        service-specific rules; database/app access is requested
                        by those domains against this network's contract.
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                      description: Merged into every resource this network creates.
                    reclaimPolicy:
                      type: string
                      enum: [Delete, Retain]
                      default: Delete
                      description: >-
                        Outcome intent, using the Kubernetes PersistentVolume
                        vocabulary. Retain leaves cloud resources in place when
                        this composite is deleted (production networks). The
                        mapping to Crossplane management policies is an
                        implementation detail owned by the composition — the
                        field deliberately does NOT echo any Crossplane
                        machinery, past or present.
                    overrides:
                      type: object
                      description: >-
                        Bounded escape hatch with an explicit support boundary.
                        Exists so operational edge cases have a sanctioned
                        outlet instead of forcing leaks into the primary
                        contract.
                      properties:
                        availabilityZoneNames:
                          type: array
                          items:
                            type: string
                          description: >-
                            Explicit AZ names, overriding the derived
                            region+suffix list (for regions with non-contiguous
                            AZ lettering or capacity constraints). Length must
                            equal availabilityZones.
                        providerConfigName:
                          type: string
                          description: >-
                            Crossplane ProviderConfig for account/credential
                            selection. Defaults to "default".
                  required:
                    - id
                    - region
              required:
                - parameters
            status:
              type: object
              properties:
                networkId:
                  type: string
                  description: Cloud network identifier (vpc-...).
                publicSubnetIds:
                  type: array
                  items: { type: string }
                privateSubnetIds:
                  type: array
                  items: { type: string }
                subnetIds:
                  type: array
                  items: { type: string }
                  description: All subnet ids (legacy-status-compatible union).
                securityGroupIds:
                  type: array
                  items: { type: string }
                availabilityZoneNames:
                  type: array
                  items: { type: string }
                  description: Resolved AZ names, for sibling AZ alignment.
                cidrBlock:
                  type: string
